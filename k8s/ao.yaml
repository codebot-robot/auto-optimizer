apiVersion: v1
kind: ServiceAccount
metadata:
  name: ao
  namespace: ao-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ao
  namespace: ao-sandboxes
rules:
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
  - apiGroups:
      - auto-optimizer.labs.gke.io
    resources:
      - heroruns
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - auto-optimizer.labs.gke.io
    resources:
      - heroruns/status
    verbs:
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ao
  namespace: ao-sandboxes
subjects:
  - kind: ServiceAccount
    name: ao
    namespace: ao-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ao
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ao-config
  namespace: ao-system
data:
  AO_LISTEN: "0.0.0.0:8081"
  AO_HTTP: "0.0.0.0:8080"
  SANDBOX_NAMESPACE: "ao-sandboxes"
  SANDBOX_IMAGE: ""
  SANDBOXD_IMAGE: ""
  OPENAI_MODEL: ""
  AO_FAKE_SCRIPT: ""
  VERTEX_PROJECT: ""
  VERTEX_LOCATION: ""
  # Comma-separated repository URLs.
  AO_REPOS: ""
  # The base URL used in pull request bodies.
  AO_PUBLIC_URL: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ao-state
  namespace: ao-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ao
  namespace: ao-system
spec:
  # Exactly one replica because state is on a ReadWriteOnce PVC; a second replica needs ObjectFS (epic #33).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ao
  template:
    metadata:
      labels:
        app: ao
    spec:
      serviceAccountName: ao
      securityContext:
        runAsNonRoot: true
        # The nonroot user in the distroless base image is uid and gid 65532. Fresh PersistentVolumes
        # on most provisioners (such as GCE PD and ext4-backed volumes) are owned by root with mode 0755,
        # whereas kind's local-path provisioner creates the directory world-writable (which is why e2e
        # tests cannot catch this). Setting fsGroup ensures Kubernetes makes the volume group-writable on mount.
        fsGroup: 65532
      containers:
        - name: ao
          image: ao
          command:
            - /ao
            - serve
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
          livenessProbe:
            tcpSocket:
              port: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: ao-config
            - secretRef:
                name: ao-model-keys
                optional: true
            - secretRef:
                name: ao-forge
                optional: true
          volumeMounts:
            - name: state
              mountPath: /home/nonroot/.local/auto-optimizer
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: ao-state
---
apiVersion: v1
kind: Service
metadata:
  name: ao
  namespace: ao-system
spec:
  type: ClusterIP
  selector:
    app: ao
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 8081
      targetPort: 8081
