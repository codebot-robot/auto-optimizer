apiVersion: v1
kind: ServiceAccount
metadata:
  name: ao
  namespace: ao-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ao
  namespace: ao-system
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ao
  namespace: ao-system
subjects:
  - kind: ServiceAccount
    name: ao
    namespace: ao-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ao
  namespace: ao-sandboxes
rules:
  - apiGroups:
      - agents.x-k8s.io
    resources:
      - sandboxes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ao
  namespace: ao-sandboxes
subjects:
  - kind: ServiceAccount
    name: ao
    namespace: ao-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ao
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ao-config
  namespace: ao-system
data:
  AO_LISTEN: "0.0.0.0:8081"
  AO_HTTP: "0.0.0.0:8080"
  SANDBOX_NAMESPACE: "ao-sandboxes"
  SANDBOX_IMAGE: ""
  SANDBOXD_IMAGE: ""
  OPENAI_MODEL: ""
  VERTEX_PROJECT: ""
  VERTEX_LOCATION: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ao
  namespace: ao-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ao
  template:
    metadata:
      labels:
        app: ao
    spec:
      serviceAccountName: ao
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ao
          image: ao
          command:
            - /ao
            - serve
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
          livenessProbe:
            tcpSocket:
              port: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: ao-config
            - secretRef:
                name: ao-model-keys
                optional: true
          volumeMounts:
            - name: state
              mountPath: /home/nonroot/.local/auto-optimizer
      volumes:
        # State directory stored on an emptyDir for now; epic #33 will switch this to ObjectFS.
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ao
  namespace: ao-system
spec:
  type: ClusterIP
  selector:
    app: ao
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 8081
      targetPort: 8081
