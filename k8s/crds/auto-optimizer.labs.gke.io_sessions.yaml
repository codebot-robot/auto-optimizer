---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: sessions.auto-optimizer.labs.gke.io
spec:
  group: auto-optimizer.labs.gke.io
  names:
    kind: Session
    listKind: SessionList
    plural: sessions
    shortNames:
    - sess
    singular: session
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runID
      name: Run
      type: string
    - jsonPath: .spec.parent
      name: Parent
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.outcome
      name: Outcome
      type: string
    - jsonPath: .status.turns
      name: Turns
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Session is the Schema for the sessions API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SessionSpec defines the immutable desired inputs for running a root or child Session.
              Bulk payloads such as conversation transcripts (messages.jsonl) and unabridged tool
              outputs live on the state volume rather than in Session.
            properties:
              allowPullRequest:
                description: AllowPullRequest reports whether this session may invoke
                  the open_pull_request tool.
                type: boolean
              ancestors:
                description: Ancestors is the ordered chain of ancestor Session names
                  from the root session down to Parent.
                items:
                  type: string
                type: array
              branch:
                description: Branch is the expected git branch name for this session's
                  work, if any.
                type: string
              deadline:
                description: Deadline is the time by which the session must stop.
                format: date-time
                type: string
              heroRunName:
                description: HeroRunName is the name of the HeroRun resource in the
                  same namespace, if any.
                type: string
              initialPrompt:
                description: InitialPrompt is the initial user prompt or task assigned
                  to the session.
                type: string
              maxDepth:
                description: MaxDepth limits how deep child sessions may be nested
                  under this session (0 uses the controller default).
                type: integer
              maxTurns:
                description: MaxTurns limits the number of LLM turns for this session
                  (0 uses the controller default).
                type: integer
              model:
                description: Model overrides the LLM model name used for this session;
                  empty uses the controller default.
                type: string
              parent:
                description: |-
                  Parent is the name of the parent Session that spawned this child session.
                  Empty for root run sessions and standalone sessions.
                type: string
              repository:
                description: Repository is the forge URL of the repository this session
                  operates on, if any.
                type: string
              runID:
                description: RunID is the unique identifier of the HeroRun this session
                  belongs to, if any.
                type: string
              sandboxName:
                description: SandboxName is the name of the Sandbox resource in the
                  same namespace backing tool execution.
                type: string
              systemPrompt:
                description: SystemPrompt is the initial system prompt seeded into
                  a new session; empty uses the toolset default.
                type: string
              toolset:
                description: Toolset is the name of the toolset (tools and default
                  system prompt) for this session.
                type: string
              workspaceClaimName:
                description: WorkspaceClaimName is the name of the PVC holding the
                  shared workspace, if any.
                type: string
            type: object
          status:
            description: SessionStatus defines the observed progress and outcome of
              a Session.
            properties:
              conditions:
                description: Conditions track high-level readiness and state transitions
                  of the session.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              costUSD:
                description: CostUSD is the estimated LLM cost accrued by this session
                  in USD.
                type: number
              error:
                description: Error holds the error message when the session failed
                  or was canceled.
                type: string
              finishedAt:
                description: FinishedAt is the time when the session reached a terminal
                  phase.
                format: date-time
                type: string
              messageCount:
                description: MessageCount is the number of messages recorded in the
                  session transcript on the state volume.
                type: integer
              observedAt:
                description: ObservedAt is the time when the session controller last
                  wrote status for this session.
                format: date-time
                type: string
              outcome:
                description: Outcome classifies why the session reached a terminal
                  phase.
                type: string
              phase:
                description: Phase is the current lifecycle phase of the session.
                type: string
              prBody:
                description: PRBody is the pull request description proposed by the
                  agent when Outcome is PullRequest.
                type: string
              prTitle:
                description: PRTitle is the pull request title proposed by the agent
                  when Outcome is PullRequest.
                type: string
              startedAt:
                description: StartedAt is the time when the session started executing.
                format: date-time
                type: string
              summary:
                description: Summary is a human-readable summary of the session outcome
                  (for example from the finish tool).
                type: string
              turns:
                description: Turns is the number of LLM turns executed by this session
                  so far.
                type: integer
              waitingUntil:
                description: WaitingUntil records when a waiting session's wait timeout
                  expires.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
