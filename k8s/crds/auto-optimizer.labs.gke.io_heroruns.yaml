---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: heroruns.auto-optimizer.labs.gke.io
spec:
  group: auto-optimizer.labs.gke.io
  names:
    kind: HeroRun
    listKind: HeroRunList
    plural: heroruns
    shortNames:
    - hr
    singular: herorun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.goal
      name: Goal
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.branch
      name: Branch
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HeroRun is the Schema for the heroruns API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HeroRunSpec defines the desired state of a HeroRun.
              Spec is written once when the orchestrator publishes the object and never edited by the agent.
            properties:
              baseCommit:
                description: BaseCommit is the commit SHA in the repository from which
                  the run started.
                type: string
              goal:
                description: Goal is the name of the optimization goal.
                type: string
              repository:
                description: Repository is the forge URL of the repository being optimized,
                  matching state.Repo.URL.
                type: string
              runID:
                description: RunID is the unique identifier of the run.
                type: string
            required:
            - baseCommit
            - goal
            - repository
            - runID
            type: object
          status:
            description: HeroRunStatus defines the observed state and lifecycle progress
              of a HeroRun.
            properties:
              branch:
                description: Branch is the git branch name created for this run.
                type: string
              conditions:
                description: Conditions track the state transitions and observations
                  of the run.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              finishedAt:
                description: FinishedAt is the time when the run reached a terminal
                  phase.
                format: date-time
                type: string
              observedAt:
                description: ObservedAt is the time when the orchestrator last wrote
                  status for this run.
                format: date-time
                type: string
              phase:
                description: Phase is the current lifecycle phase of the run, matching
                  the state.RunPhase value.
                type: string
              pullRequestURL:
                description: PullRequestURL is the forge URL of the pull request opened
                  for this run, if any.
                type: string
              sandboxName:
                description: SandboxName is the name of the Sandbox resource running
                  this optimization session.
                type: string
              startedAt:
                description: StartedAt is the time when the run started.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
