---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: heroruns.auto-optimizer.labs.gke.io
spec:
  group: auto-optimizer.labs.gke.io
  names:
    kind: HeroRun
    listKind: HeroRunList
    plural: heroruns
    shortNames:
    - hr
    singular: herorun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.goal
      name: Goal
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.branch
      name: Branch
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HeroRun is the Schema for the heroruns API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HeroRunSpec defines the desired state of a HeroRun.
              Spec is written once when the orchestrator publishes the object and never edited by the agent.
            properties:
              baseCommit:
                description: BaseCommit is the commit SHA in the repository from which
                  the run started.
                type: string
              deadline:
                description: Deadline is the time by which the run should complete.
                format: date-time
                type: string
              goal:
                description: Goal is the name of the optimization goal.
                type: string
              goalDefinition:
                description: GoalDefinition holds the frozen goal definition captured
                  for this run.
                properties:
                  agents:
                    description: Agents lists custom agents permitted to work on this
                      goal.
                    items:
                      type: string
                    type: array
                  body:
                    description: Body holds the Markdown description of the goal.
                    type: string
                  budget:
                    description: Budget defines resource and time limits for a goal
                      run.
                    properties:
                      maxCostUSD:
                        description: MaxCostUSD is the maximum estimated LLM budget
                          in USD for the run.
                        type: number
                      maxDuration:
                        description: MaxDuration is the maximum wall-clock duration
                          for the run.
                        type: string
                    type: object
                  hash:
                    description: Hash is the content hash of the goal file.
                    type: string
                  metric:
                    description: Metric defines benchmark measurement parameters for
                      a metric goal.
                    properties:
                      command:
                        description: Command is the benchmark command to measure.
                        type: string
                      direction:
                        description: Direction is "lower" or "higher", indicating
                          whether a smaller or larger measurement is better.
                        type: string
                      minImprovement:
                        description: MinImprovement is the minimum improvement threshold
                          required to declare victory.
                        type: string
                      runs:
                        description: Runs is the number of benchmark repetitions to
                          execute per measurement.
                        type: integer
                      timeout:
                        description: Timeout is the maximum execution duration for
                          one benchmark run.
                        type: string
                      unit:
                        description: Unit is the measurement unit string (e.g., "ns/op",
                          "ms", "MB").
                        type: string
                    required:
                    - command
                    - direction
                    type: object
                  schedule:
                    description: Schedule specifies when the goal should run automatically.
                    type: string
                  verify:
                    description: Verify is the shell command used to verify goal satisfaction.
                    type: string
                required:
                - body
                - hash
                type: object
              repository:
                description: Repository is the forge URL of the repository being optimized,
                  matching state.Repo.URL.
                type: string
              runID:
                description: RunID is the unique identifier of the run.
                type: string
            required:
            - baseCommit
            - goal
            - repository
            - runID
            type: object
          status:
            description: HeroRunStatus defines the observed state and lifecycle progress
              of a HeroRun.
            properties:
              activeOperation:
                description: ActiveOperation tracks an active long-running operation
                  in flight and its outcome once finished.
                properties:
                  done:
                    description: Done reports whether the operation worker has finished
                      executing.
                    type: boolean
                  error:
                    description: Error holds the error message when Result is Failed
                      or Canceled.
                    type: string
                  finishedAt:
                    description: FinishedAt is the time when the operation finished.
                    format: date-time
                    type: string
                  id:
                    description: ID uniquely identifies this operation instance.
                    type: string
                  prBody:
                    description: PRBody is the pull request description proposed by
                      the agent when Result is PullRequest.
                    type: string
                  prTitle:
                    description: PRTitle is the pull request title proposed by the
                      agent when Result is PullRequest.
                    type: string
                  result:
                    description: Result classifies the outcome once Done is true.
                    type: string
                  summary:
                    description: Summary is the agent's finish summary when Result
                      is Finished.
                    type: string
                required:
                - id
                type: object
              baseline:
                description: Baseline holds the baseline metric measurement for metric
                  goals.
                type: number
              branch:
                description: Branch is the git branch name created for this run.
                type: string
              candidate:
                description: Candidate holds the candidate metric measurement for
                  metric goals.
                type: number
              candidateCommit:
                description: CandidateCommit is the commit SHA produced by the run.
                type: string
              conditions:
                description: Conditions track the state transitions and observations
                  of the run.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              costUSD:
                description: CostUSD holds the total estimated LLM cost for this run.
                type: number
              error:
                description: Error holds any fatal error message that caused the run
                  to fail.
                type: string
              errorKind:
                description: ErrorKind classifies the fatal error (for example "failed"
                  or "portal_bind_failed").
                type: string
              finishedAt:
                description: FinishedAt is the time when the run reached a terminal
                  phase.
                format: date-time
                type: string
              observedAt:
                description: ObservedAt is the time when the orchestrator last wrote
                  status for this run.
                format: date-time
                type: string
              phase:
                description: Phase is the current lifecycle phase of the run, matching
                  the state.RunPhase value.
                type: string
              phaseTimestamps:
                additionalProperties:
                  format: date-time
                  type: string
                description: PhaseTimestamps tracks the timestamps of lifecycle phase
                  transitions.
                type: object
              prBody:
                description: PRBody is the markdown description of the pull request
                  for this run.
                type: string
              prTitle:
                description: PRTitle is the title of the pull request for this run.
                type: string
              pullRequestURL:
                description: PullRequestURL is the forge URL of the pull request opened
                  for this run, if any.
                type: string
              readyDeadline:
                description: |-
                  ReadyDeadline is the deadline by which the sandbox environment must become ready.
                  Temporary: retained for compatibility with today's reconciler until PhasePreparing is migrated to Run.
                format: date-time
                type: string
              sandboxName:
                description: SandboxName is the name of the Sandbox resource running
                  this optimization session.
                type: string
              sessionId:
                description: SessionID is the unique identifier of the active optimization
                  session.
                type: string
              startedAt:
                description: StartedAt is the time when the run started.
                format: date-time
                type: string
              summary:
                description: Summary is a human-readable summary of the run outcome.
                type: string
              turns:
                description: Turns is the count of agent interaction turns executed
                  in this run.
                type: integer
              workspaceClaimName:
                description: WorkspaceClaimName is the name of the persistent volume
                  claim holding the workspace.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
